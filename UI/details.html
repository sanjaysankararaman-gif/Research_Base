<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Details | Research base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="index.html">Research base</a>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventory.html">My Library</a></li>
                    <li class="nav-item"><a class="btn btn-sm btn-outline-success ms-2" data-excel-link href="#">Download Excel</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container" style="max-width: 960px;">

        <div id="banner"></div>
        <div id="version-note"></div>

        <!-- Paper heading -->
        <section id="paper-header" class="mb-3">
            <span id="publication-type" class="badge text-bg-primary mb-2">Loading…</span>
            <h1 id="paper-title">Loading paper…</h1>
            <p id="fill-summary" class="text-secondary mb-0"></p>
        </section>

        <!-- All 23 fields, numbered and grouped as in
             "Essential Fields for Research Publication Database" -->
        <section id="fields" class="card mb-3">
            <div class="table-responsive">
                <table class="table mb-0 fields-table">
                    <tbody id="fields-body">
                        <tr><td class="text-secondary py-4 text-center">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- PDF Information -->
        <section id="pdf-info" class="card p-4 mb-3">
            <h2 class="h6 mb-2">Research Paper PDF</h2>
            <p id="pdf-status" class="mb-2">PDF availability: Not checked</p>
            <a id="pdf-link" href="#" target="_blank" rel="noopener" class="btn btn-outline-primary btn-sm align-self-start">
                View / Open PDF
            </a>
        </section>

        <!-- Navigation -->
        <section id="page-navigation" class="d-flex gap-3 mt-4">
            <a href="index.html" class="btn btn-primary">Look up another DOI</a>
            <a href="inventory.html" class="btn btn-outline-secondary">Back to My Library</a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Research base. All rights reserved.</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/details.js"></script>
</body>
</html>
