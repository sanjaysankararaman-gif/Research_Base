<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library | Research base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="index.html">Research base</a>
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="inventory.html">My Library</a></li>
                    <li class="nav-item"><a class="btn btn-sm btn-outline-success ms-2" data-excel-link href="#">Download Excel</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">

        <!-- Inventory Heading -->
        <section id="inventory-header" class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">My Library</h1>
                <p class="text-secondary mb-0">All saved research papers. Everything here is also in the Excel file.</p>
            </div>
            <a href="index.html" class="btn btn-primary">+ Add a paper</a>
        </section>

        <!-- Search and Filter Section -->
        <section id="inventory-search" class="card p-3 mb-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-7">
                    <input type="text" id="search-input" class="form-control"
                           placeholder="Search by title, author or DOI">
                </div>
                <div class="col-md-3">
                    <select id="publication-filter" class="form-select" aria-label="Publication type">
                        <option value="">All types</option>
                        <option value="Journal">Journal</option>
                        <option value="Conference">Conference</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="button" id="search-button" class="btn btn-outline-secondary w-100">Search</button>
                </div>
            </div>
        </section>

        <!-- Research Paper Table -->
        <section id="inventory-table" class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>S.No.</th>
                            <th>Paper Title</th>
                            <th>Authors</th>
                            <th>Year</th>
                            <th>Publication Type</th>
                            <th>DOI</th>
                            <th>View</th>
                        </tr>
                    </thead>
                    <tbody id="paper-list">
                        <tr><td colspan="7" class="text-center text-secondary py-4">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <p id="paper-count" class="text-secondary small mt-2"></p>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Research base. All rights reserved.</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/inventory.js"></script>
</body>
</html>
