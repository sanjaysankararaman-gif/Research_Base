[project]
name = "research-base"
version = "1.0.0"
description = "DOI -> essential publication fields, stored in a library and an Excel file"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (used for local setup).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
]

[tool.vercel]
# The app is backend/main.py.
entrypoint = "backend.main:app"
